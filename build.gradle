plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0'
}

//'Cider Apple Profile'
group = 'org.craft.mcs'
version = '0.0.1-SNAPSHOT'
description = 'cap'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('sentryVersion', "8.48.0")
    set('springCloudVersion', "2025.1.2")
    set('jMolecules', "2025.0.2")
    set('archUnitVersion', "1.4.2")
    set('namastackOutboxVersion', "1.6.0")
    set('pitestCoreVersion', "1.25.3")
    set('pitestJUnit5Version', "1.2.3")
    set('junitVersion', "6.0.3")
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.sentry:sentry-spring-boot-4-starter'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation "io.namastack:namastack-outbox-starter-jdbc:${namastackOutboxVersion}"

    implementation 'tech.units:indriya:2.2.4'
    implementation 'javax.measure:unit-api:2.2'
    implementation 'systems.uom:systems-common:2.2'
    implementation 'systems.uom:systems-quantity:2.2'
    implementation 'systems.uom:systems-unicode:2.2'
    implementation 'systems.uom:systems-ucum:2.2'
    //
    implementation 'org.jmolecules:jmolecules-ddd'
    //
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    //
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    //
    runtimeOnly 'org.postgresql:postgresql'
    //
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    //
    testImplementation enforcedPlatform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.testcontainers:testcontainers-grafana'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
    testImplementation("org.assertj:assertj-core:4.0.0-M1")
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "io.sentry:sentry-bom:${sentryVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.jmolecules:jmolecules-bom:${jMolecules}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '1g'
}

pitest {
    targetClasses = [
        'org.craft.mcs.cap.core.feedstock.domain.*',
        'org.craft.mcs.cap.core.production.domain.*',
        'org.craft.mcs.cap.core.production.candidate.domain.*',
        'org.craft.mcs.cap.core.measurement.domain.*',
        'org.craft.mcs.cap.core.traceability.domain.*'
    ]
    targetTests = [
        'org.craft.mcs.cap.feedstock.domain.*',
        'org.craft.mcs.cap.production.domain.*',
        'org.craft.mcs.cap.production.candidate.domain.*',
        'org.craft.mcs.cap.core.measurement.domain.*',
        'org.craft.mcs.cap.core.traceability.domain.*'
    ]
    pitestVersion = pitestCoreVersion
    junit5PluginVersion = pitestJUnit5Version
    threads = 1
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    exportLineCoverage = true
    failWhenNoMutations = true
    mutationThreshold = 100
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:unchecked')
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
