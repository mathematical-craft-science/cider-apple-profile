server:
  shutdown: graceful
  port: 8088

spring:
  application:
    name: cider-apple-profile
  liquibase:
    change-log: db/changelog/master-changelog.xml
    drop-first: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
  datasource:
    url: jdbc:postgresql://localhost:5832/cap_db
    username: username
    password: password

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

sentry:
  enabled: false

cap:
  cider-analysis:
    sugar-acidity:
      assessor: rectangle # или ellipse
