server:
  shutdown: graceful
  port: 8088

spring:
  application:
    name: cider-apple-profile
  liquibase:
    change-log: db/changelog/master-changelog.xml
    drop-first: off
  datasource:
    url: jdbc:postgresql://localhost:5832/cap_db
    username: username
    password: password

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

sentry:
  enabled: false

cap:
  cider-analysis:
    sugar-acidity:
      assessor: rectangle # или ellipse
