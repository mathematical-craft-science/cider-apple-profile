server:
  shutdown: graceful
  port: 8088

spring:
  application:
    name: cider-apple-profile
  liquibase:
    change-log: db/changelog/master-changelog.xml
    drop-first: off
  datasource:
    url: jdbc:postgresql://localhost:5832/cap_db
    username: username
    password: password
  mail:
    host: ${CAP_SMTP_HOST:localhost}
    port: ${CAP_SMTP_PORT:1025}
    username: ${CAP_SMTP_USERNAME:}
    password: ${CAP_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${CAP_SMTP_AUTH:false}
          connectiontimeout: ${CAP_SMTP_CONNECTION_TIMEOUT_MILLIS:10000}
          timeout: ${CAP_SMTP_READ_TIMEOUT_MILLIS:10000}
          writetimeout: ${CAP_SMTP_WRITE_TIMEOUT_MILLIS:10000}
          starttls:
            enable: ${CAP_SMTP_STARTTLS:false}
          ssl:
            enable: ${CAP_SMTP_SSL:false}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

sentry:
  enabled: false

cap:
  query:
    cursor:
      time-to-live: 1h
      active-key:
        id: local-development
        secret: ${CAP_QUERY_CURSOR_HMAC_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  account:
    invitation-time-to-live: 7d
    invitation-email:
      frontend-base-url: ${CAP_FRONTEND_BASE_URL:http://localhost:5173}
      sender-address: ${CAP_SMTP_FROM:no-reply@cap.local}
      sender-name: ${CAP_SMTP_SENDER_NAME:Cider Analytical Platform}
    default-workspace:
      name: My cidery
      type: CIDERY
      settings:
        measurement-stale-after: 14d
        default-acidity-basis: MALIC_ACID
  security:
    provider: ${CAP_SECURITY_PROVIDER:CLERK}
    clerk:
      issuer: ${CLERK_ISSUER:https://proud-mastiff-42.clerk.accounts.dev}
      jwk-set-uri: ${CLERK_JWKS_URI:https://proud-mastiff-42.clerk.accounts.dev/.well-known/jwks.json}
    keycloak:
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/cap}
      jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/cap/protocol/openid-connect/certs}
      audience: ${KEYCLOAK_AUDIENCE:cap-backend}
    public-access:
      openapi: false
      debug: false
  profile-analysis:
    sugar-acidity:
      geometry: RECTANGLE # or ELLIPSE
    readiness:
      ph:
        generic-yeast-tolerance-min: 2.8
        cider-guidance-min: 3.3
        cider-guidance-max: 3.8
        high-microbial-risk: 4.0
        source-code: CURATED_CIDER_PH_RULES_V1
        source-comment: >
          Curated defaults from Merwin/Valois/Padilla-Zakour, Jolicoeur,
          WSU/MSU cider materials, future yeast manufacturer datasheets,
          and generic enology references as fallback.
      yan:
        severe-low: 75
        low: 150
        high: 400
        source-code: CURATED_CIDER_YAN_RULES_V1
        source-comment: >
          Curated defaults from cider nitrogen references, Bisson/Butzke
          stuck-fermentation guidance, AWRI/Lallemand YAN guidance,
          and UC Davis Brix-based nutrient recommendations.

namastack:
  outbox:
    polling:
      batch-size: 10
      trigger: fixed
      fixed:
        interval: 2s
    retry:
      policy: exponential
      max-retries: 5
      exponential:
        initial-delay: 2s
        multiplier: 2.0
        max-delay: 1m
      jitter: 500ms
    multicaster:
      enabled: false
    jdbc:
      schema-initialization:
        enabled: false
