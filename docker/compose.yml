name: cap
services:
  postgres:
    image: "postgres:18-alpine"
    volumes:
      - cap-postgres-data:/var/lib/postgresql/cap
    ports:
      - "5832:5432"
    environment:
      - POSTGRES_DB=cap_db
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d cap_db" ]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak-postgres:
    image: "postgres:18-alpine"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    healthcheck:
      test: pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
      args:
        KEYCLOAK_VERSION: "26.7.0"
    command: [ "start-dev", "--import-realm" ]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      CAP_KEYCLOAK_REALM: ${CAP_KEYCLOAK_REALM:-cap}
      CAP_FRONTEND_URL: ${CAP_FRONTEND_URL:-http://localhost:5173}
      CAP_KEYCLOAK_SMTP_HOST: mailpit
      CAP_KEYCLOAK_SMTP_PORT: "1025"
      CAP_KEYCLOAK_SMTP_FROM: ${CAP_KEYCLOAK_SMTP_FROM:-no-reply@cap.local}
      CAP_KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${CAP_KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Cider Analytical Platform}
      CAP_KEYCLOAK_SMTP_AUTH: "false"
      CAP_KEYCLOAK_SMTP_STARTTLS: "false"
      CAP_KEYCLOAK_SMTP_SSL: "false"
      CAP_KEYCLOAK_SMTP_USERNAME: ""
      CAP_KEYCLOAK_SMTP_PASSWORD: ""
    healthcheck:
      test: >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
        printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
        grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mailpit:
    image: "axllent/mailpit:v1.30.3"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cap-postgres-data:
  keycloak-postgres-data:
