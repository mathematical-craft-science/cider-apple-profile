name: cap
services:
  postgres:
    image: "postgres:18-alpine"
    volumes:
      - cap-postgres-data:/var/lib/postgresql/cap
    ports:
      - "5832:5432"
    environment:
      - POSTGRES_DB=cap_db
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U username -d cap_db" ]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: "axllent/mailpit:v1.30.3"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cap-postgres-data:
